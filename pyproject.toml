[project]
name = "mcp-financial-automation-client"
version = "0.1.0"
description = "WhatsApp payment messages to a Google Sheets ledger via MCP + LangGraph, with a daily WhatsApp summary and a Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=6.2.1",
    "langchain-core>=1.4.8",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.2.2",
    "langgraph>=1.2.4",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
